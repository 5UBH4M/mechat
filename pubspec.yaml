name: mechat
description: "MeChat - A Flutter messaging application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^17.3.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  firebase_storage: ^13.4.2
  flutter_webrtc: ^1.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.7
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  crop_your_image: ^1.1.0
  record: ^7.0.0
  audioplayers: ^6.7.1
  uuid: ^4.5.3
  intl: ^0.20.2
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.0
  cached_network_image: ^3.4.1
  encrypt: ^5.0.3
  equatable: ^2.0.8
  url_launcher: ^6.3.2
  any_link_preview: ^3.0.3
  image: ^4.8.0
  simple_pip_mode: ^1.1.0
  swipe_to: ^1.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  google_fonts: ^8.1.0
  scrollable_positioned_list: ^0.3.8
  fuzzy: ^0.5.1
  google_sign_in: ^6.2.1
  google_sign_in_all_platforms: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage_linux: ^3.0.1
  cross_file: ^0.3.5
  path: ^1.9.1
  sqflite: ^2.4.2
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
